name: Lint Shell Scripts

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'dcvm'
      - '**/*.sh'
      - '.github/workflows/lint.yaml'

jobs:
  lint:
    name: Bash lint (bash -n + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck

      - name: Find shell files
        id: find_files
        run: |
          set -euo pipefail
          # include top-level `dcvm` and all tracked shell scripts
          files=$(git ls-files -- "dcvm" "*.sh" || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run bash -n and shellcheck
        run: |
          set -euo pipefail
          files="${{ steps.find_files.outputs.files }}"
          if [[ -z "$files" ]]; then
            echo "No shell files found to lint"
            exit 0
          fi
          # xargs -I splits on newlines, so `tr '\n' ' '` collapsed every
          # path into a single {} and the -f test never matched. Read one
          # path per line so each shell file is actually linted.
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ -f "$f" ]]; then
              echo "-- Linting $f --"
              bash -n "$f"
              # Severity is error for now. Ratchet to -S warning after a warning cleanup.
              shellcheck -S error "$f"
            fi
          done <<< "$files"
