name: Lint Shell Scripts

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'dcvm'
      - '**/*.sh'
      - '.github/workflows/lint.yaml'

permissions:
  contents: read

jobs:
  lint:
    name: Bash lint (bash -n + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck

      - name: Run bash -n and shellcheck
        run: |
          set -euo pipefail
          # Build the file list inside this step (not via a step output pasted
          # into the script) so a crafted filename can't inject shell.
          # Include top-level `dcvm` and all tracked shell scripts.
          mapfile -d '' -t files < <(git ls-files -z -- "dcvm" "*.sh")
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell files found to lint"
            exit 0
          fi
          # The old `tr '\n' ' ' | xargs -I{}` collapsed every path into a
          # single {} and nothing was linted. Lint each file individually.
          for f in "${files[@]}"; do
            if [[ -f "$f" ]]; then
              echo "-- Linting $f --"
              bash -n "$f"
              # Severity is error for now. Ratchet to -S warning after a warning cleanup.
              shellcheck -S error "$f"
            fi
          done
