name: Format Shell Scripts (shfmt)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'dcvm'
      - '**/*.sh'
      - '.github/workflows/format.yaml'

permissions:
  contents: read

jobs:
  format:
    name: Check formatting (shfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y shfmt

      - name: Check shfmt formatting
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ -f "$f" ]]; then
              files+=("$f")
            fi
          done < <(git ls-files -- dcvm '*.sh')
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell files to check"
            exit 0
          fi
          shfmt -d -i 2 "${files[@]}"
